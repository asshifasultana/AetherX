name: Railway Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    secrets:
      RAILWAY_TOKEN:
        required: true
      RAILWAY_SERVICE_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: railway-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test frontend/coordinates.test.js frontend/tests/*.test.js

      - name: Validate Railway secrets
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_SERVICE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. Configure it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.63.1

      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: railway up --service "$RAILWAY_SERVICE_ID" --ci
