name: Railway Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
    secrets:
      RAILWAY_TOKEN:
        required: true
      RAILWAY_SERVICE_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: railway-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test frontend/coordinates.test.js frontend/tests/*.test.js

      - name: Validate Railway secrets
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_SERVICE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. Configure it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      # The CLI's postinstall downloads its binary from GitHub Releases,
      # which can return transient 5xx errors, so retry a few times.
      - name: Install Railway CLI
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm install --global @railway/cli@5.63.1; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Railway CLI install failed (attempt $attempt/3), retrying in $((attempt * 30))s..."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Railway CLI install failed after 3 attempts."
          exit 1

      # Railpack downloads build tooling (mise) from GitHub Releases during
      # the build. Retry only when the failure looks transient so real build
      # errors still fail fast.
      - name: Deploy to Railway production
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          log="$(mktemp)"
          for attempt in 1 2 3; do
            set +e
            railway up --service "$RAILWAY_SERVICE_ID" --ci 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -qiE 'temporary failure|gateway time-?out|50[234] |bad gateway|service unavailable' "$log"; then
              echo "::error::Railway deploy failed with a non-transient error."
              exit "$status"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Railway deploy hit a transient network error (attempt $attempt/3), retrying in $((attempt * 60))s..."
              sleep $((attempt * 60))
            fi
          done
          echo "::error::Railway deploy failed after 3 attempts due to transient errors."
          exit "$status"
